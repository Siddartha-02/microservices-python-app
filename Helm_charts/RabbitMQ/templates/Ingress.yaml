apiVersion: networking.k8s.io/v1 
kind: Ingress 
metadata: 
 name: rabbitmq-ingress 
 namespace: micro 
 annotations: 
 argocd.argoproj.io/tracking-id: rabbitmq:networking.k8s.io/Ingress:micro/rabbitmq-ingress 
 nginx.ingress.kubernetes.io/rewrite-target: /$2 
 nginx.ingress.kubernetes.io/use-regex: "true" 
spec: 
 ingressClassName: nginx 
 rules: 
 - host: siddhu.ddns.com 
 http: 
 paths: 
 - path: /rabbitmq(/|$)(.*) 
 pathType: ImplementationSpecific 
 backend: 
 service: 
 name: rabbitmq 
 port: 
 number: 15672
