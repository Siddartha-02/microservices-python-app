apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rabbitmq-ingress
  namespace: micro
spec:
  ingressClassName: nginx
  rules:
    - host: siddhu.ddns.net
      http:
        paths:
          - path: /rabbitmq
            pathType: ImplementationSpecific
            backend:
              service:
                name: rabbitmq
                port:
                  number: 15672
